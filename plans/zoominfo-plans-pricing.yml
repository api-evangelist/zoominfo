metering:
  model: credits
  note: Rate limits govern throughput; credits govern data. They are separate budgets and either can stop a workload. Credit balances are not exposed on the plan — they are per-account entitlements set
    in the Admin Portal.
  credit_classes:
  - name: free
    description: Search, lookup, lookalikes, recommendations, audience browsing and GTM context reads consume no credits.
  - name: bulk-data
    description: Enrichment consumes one bulk credit per NEW record redeemed — company, contact, intent, scoop or news.
  - name: ai-action
    description: Agentic research and synthesis consume AI action credits. conversation_intelligence is documented at a ~9-credit minimum per call.
  batch_limits:
  - operation: Enrich Companies
    max_records_per_call: 25
    cost: 1 bulk credit per new company record
  - operation: Enrich Contacts
    max_records_per_call: 25
    cost: 1 bulk credit per new contact record
  - operation: Account Research
    max_records_per_call: 1
    cost: AI action credits
  - operation: Contact Research
    max_records_per_call: 1
    cost: AI action credits
  exhaustion:
    error_code: PFAPI0011
    status: 400
    message: Credit Limit Reached
  usage_visibility:
    current_api: GET /data/v1/users/usage (UserInterface_userUsage)
    legacy_api: GET /lookup/usage plus X-Usage-* response headers on every metered call
overage:
  published: false
  note: No overage rate or burst-purchase mechanism is published. Exceeding the credit limit is an error, not a charge.
limit_increase:
