sdk_gap:
  note: >-
    ZoomInfo publishes NO first-party SDK for the current GTM API. Every first-party client library above
    is an authentication helper for the LEGACY Enterprise API, and four of the five are two to six years
    stale. For the current API the documentation instructs developers to generate their own client from
    the published OpenAPI specification with OpenAPI Generator.
  generator_guidance: https://docs.zoominfo.com/docs/openapi-specifications.md
  specs: https://docs.zoominfo.com/openapi.md
