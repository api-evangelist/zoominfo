  x-last-validated: '2026-04-18'
servers:
- url: https://api.zoominfo.com
  description: ZoomInfo API Production Server
security:
- bearerAuth: []
tags:
- name: Hashtags Enrich
  description: 'Use [Hashtags Enrich](#886fb5cc-b587-4f26-bd68-892798d45ffe) to retrieve company hashtags using valid query parameters. A Hashtags Enrich request requires you to specify the input parameters about the company you are enriching.


    Refer to the examples provided to build a valid JSON request. Use the [Hashtags Enrich Inputs](#a7bea20a-f496-431b-9403-337231c4a22e) endpoint to retrieve a list of valid input parameters you can provide.'
paths:
  /enrich/hashtag:
    parameters: []
    post:
      tags:
      - Hashtags Enrich
      summary: Zoominfo Hashtags Enrich
      description: 'Use this endpoint to match hashtag information based on [input values](#a7bea20a-f496-431b-9403-337231c4a22e) and return output fields in the response.


        **Input params**


        | Parameter | DataType | Description |

        | --- | --- | --- |

        | companyId | String | Required. The ID of the company for which you want to find hashtags. |


        **Output fields**


        | Field | Description |

        | --- | --- |

        | tag | Hashtag |

        | searchString | Hashtag string |

        | displayLabel | Hashtag string for display |

        | description | Hashtag description |

        | group | Hashtag group |

        | parentCategory | Hashtag parent category |

        | displayScore | Display hashtag score (yes or no) |

        | scoreUnit | Hashtag score unit |

        | hidden | Show or hide hashtag (Boolean) |

        | label | Hashtag label |

        | categorizedFlag | Categorized (Boolean) |'
      operationId: HashtagsEnrich
      parameters: []
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/HashtagsEnrichRequest'
              - examples:
                - companyId: '344589814'
              contentMediaType: application/json
            example:
              companyId: '344589814'
        required: true
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Tue, 21 Jan 2020 19:14:01 GMT
