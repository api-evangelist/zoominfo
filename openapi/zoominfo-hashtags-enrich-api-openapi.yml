components:
  schemas:
    Enrichhashtagsforacompany:
      title: Enrichhashtagsforacompany
      required:
      - maxResults
      - totalResults
      - currentPage
      - data
      type: object
      properties:
        maxResults:
          type: integer
          contentEncoding: int32
          example: 100
        totalResults:
          type: integer
          contentEncoding: int32
          example: 100
        currentPage:
          type: integer
          contentEncoding: int32
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Data37'
          description: ''
          example: []
    GetHashtagEnrichInput:
      title: GetHashtagEnrichInput
      required:
      - fieldName
      - fieldType
      - description
      type: object
      properties:
        fieldName:
          type: string
          example: Acme Corporation
        fieldType:
          type: string
          example: standard
        description:
          type: string
          example: Enterprise software company
      examples:
      - fieldName: companyId
        fieldType: String
        description: The id of the company for which you want to view hashtags
    HashtagsEnrichRequest:
      title: HashtagsEnrichRequest
      required:
      - companyId
      type: object
      properties:
        companyId:
          type: string
          example: '500123'
      examples:
      - companyId: '344589814'
    Data37:
      title: Data37
      required:
      - tag
      - external_id
      - searchString
      - description
      - group
      - score
      - priority
      - parentCategory
      - categorizedFlag
      - label
      type: object
      properties:
        tag:
          type: string
          example: example_value
        external_id:
          type:
          - string
          - 'null'
          example: '500123'
        searchString:
          type: string
          example: example_value
        description:
          type: string
          example: Enterprise software company
        group:
          type: string
          example: example_value
        score:
          type:
          - string
          - 'null'
          example: example_value
        priority:
          oneOf:
          - type:
            - string
            - 'null'
          - type: integer
            contentEncoding: int32
          - {}
          example: example_value
        parentCategory:
          type: string
          example: example_value
        categorizedFlag:
          type: boolean
          example: true
        label:
          type: string
          example: example_value
  securitySchemes:
    httpBearer:
      type: http
      scheme: bearer
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the /authenticate endpoint
