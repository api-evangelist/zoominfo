openapi: 3.2.0
info:
  title: Zoominfo Lookup API
  version: '1.0'
  x-refined-note:
  - x-last-validated differs across the merged source definitions and was not carried
  description: 'Operations tagged Lookup across 2 of this provider''s published API definitions: zoominfo-gtm-data-v1-openapi.json, zoominfo-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.zoominfo.com/gtm
  description: Base URL for the Data API
- url: https://api.zoominfo.com
  description: ZoomInfo API Production Server
tags:
- name: Lookup
paths:
  /data/v1/lookup/{fieldName}:
    get:
      operationId: LookupInterface_lookup
      summary: Lookup Data
      description: Returns lookup data.
      parameters:
      - name: fieldName
        in: path
        required: true
        description: The name of the lookup field e.g. 'company-rankings'
        schema:
          $ref: '#/components/schemas/FieldNameEnum'
      - name: filter[category]
        in: query
        required: false
        description: The category of the lookup field. Only applicable when accessing hashtag lookups e.g. 'Unified Communications'
        schema:
          type: string
        explode: false
      - name: filter[parentCategory]
        in: query
        required: false
        description: The parentCategory. Only applicable when accessing hashtag and tech lookups e.g. 'Communication and Collaboration'
        schema:
          type: string
        explode: false
      - name: filter[subCategory]
        in: query
        required: false
        description: The subCategory. Only applicable when accessing hashtag and tech lookups e.g. 'Unified Communications as a Service'
        schema:
          type: string
        explode: false
      - name: filter[vendor]
        in: query
        required: false
        description: The vendor of the lookup field. Only applicable when accessing hashtag and tech lookups e.g. 'microsoft corporation'
        schema:
          type: string
        explode: false
      responses:
        '200':
          description: Success
          content:
            application/vnd.api+json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
              examples:
                Look up board member filters:
                  summary: Look up board member filters
                  description: This example demonstrates how to look up board member filters using the ZoomInfo API. The response includes a sample list of available filters for board members.
                  value:
                    data:
                    - attributes:
                        name: exclude
                      id: exclude
                      type: BoardMember
                    - attributes:
                        name: include
                      id: include
                      type: BoardMember
                Look up buying groups:
                  summary: Look up buying groups
                  description: This example demonstrates how to look up buying groups using the ZoomInfo API. The response includes a sample list of available buying group types.
                  value:
                    data:
                    - attributes:
                        accessLevel: private
                        isDefault: false
                        name: HR Decision Makers
                        personas:
                        - departmentsAndJobFunctions:
                          - Human Resources
                          managementLevels:
                          - C_EXECUTIVES
                          - VP_EXECUTIVES
                          - DIRECTOR
                          - MANAGER
                          titles: null
                      id: '1913024'
                      type: BuyingGroup
                    - attributes:
                        accessLevel: private
                        isDefault: false
                        name: SecondTestGroup
                        personas:
                        - departmentsAndJobFunctions:
                          - Medical & Health
                          managementLevels:
                          - VP_EXECUTIVES
                          titles:
                          - Dentist
                      id: '1913025'
                      type: BuyingGroup
                Look up company rankings:
                  summary: Look up company rankings
                  description: This example demonstrates how to look up company rankings using the ZoomInfo API. The response includes a sample company ranking.
                  value:
                    data:
                    - attributes:
                        name: Fortune 500
                      id: fortune500
                      type: CompanyRanking
                Look up company types:
                  summary: Look up company types
                  description: This example demonstrates how to look up company types using the ZoomInfo API. The response includes a sample company type.
                  value:
                    data:
                    - attributes:
                        name: private
                      id: private
                      type: CompanyType
                Look up continents:
                  summary: Look up continents
                  description: This example demonstrates how to look up continents using the ZoomInfo API. The response includes a sample continent.
                  value:
                    data:
                    - attributes:
                        name: Africa
                      id: africa
                      type: Continent
                Look up countries:
                  summary: Look up countries
                  description: This example demonstrates how to look up countries using the ZoomInfo API. The response includes a sample country.
                  value:
                    data:
                    - attributes:
                        name: Bahamas
                      id: bahamas
                      type: Country
                Look up departments:
                  summary: Look up departments
                  description: This example demonstrates how to look up departments using the ZoomInfo API. The response includes a sample department.
                  value:
                    data:
                    - attributes:
                        name: Information Technology
                      id: '5'
                      type: Department
                Look up employee count ranges:
                  summary: Look up employee count ranges
                  description: This example demonstrates how to look up employee count ranges using the ZoomInfo API. The response includes a sample employee count range.
                  value:
                    data:
                    - attributes:
                        name: 1 - 5
                      id: 1to4
                      type: EmployeeCount
                Look up hashtag results:
                  summary: Look up hashtag results
                  description: This example demonstrates how to look up hashtag results using the API. The response includes a sample hashtag result.
                  value:
                    data:
                    - attributes:
                        name: 250+ Doctors
                      id: '#250_plus_doctors'
                      type: Hashtag
                Look up industry categories:
                  summary: Look up industry categories
                  description: This example demonstrates how to look up industry categories using the API. The response includes a sample industry category.
                  value:
                    data:
                    - attributes:
                        name: Animals & Livestock
                      id: agriculture.animals
                      type: Industry
                Look up intent topics:
                  summary: Look up intent topics
                  description: This example demonstrates how to look up intent topics using the ZoomInfo API. The response includes a sample intent topic.
                  value:
                    data:
                    - attributes:
                        category: Cloud
                        department: Information Technology
                        description: ''
                        jobFunction: Cloud / Mobility
                        name: Cloud Applications
                      id: Cloud Applications
                      type: IntentTopic
                Look up job functions:
                  summary: Look up job functions
                  description: This example demonstrates how to look up job functions using the API. The response includes a sample job function.
                  value:
                    data:
                    - attributes:
                        name: Project Development
                      id: '4.11'
                      type: JobFunction
                Look up job title hierarchies:
                  summary: Look up job title hierarchies
                  description: This example demonstrates how to look up job titles using the ZoomInfo API. The response includes samples of job titles.
                  value:
                    data:
                    - attributes:
                        name: C-Level
                        order: '2'
                      id: exec
                      type: JobTitle
                    - attributes:
                        name: VP-Level
                        order: '3'
                      id: vp
                      type: JobTitle
                Look up management levels:
                  summary: Look up management levels
                  description: This example demonstrates how to look up management levels using the API. The response includes a sample management level.
                  value:
                    data:
                    - attributes:
                        name: VP Level Execs
                      id: VP Level Exec
