                  example: '1500'
            X-RateLimit-Remaining:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '1498'
            X-RateLimit-Reset:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '1589131277'
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: cloudflare
            cf-request-id:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 02a1336a0d0000ebf89b866200000001
          content:
            application/json;charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntentTopic'
                description: ''
                examples:
                - - Name: Affordable Care Act (ACA)
                    Category: Compensation & Benefits
                    Department: Legal
                    JobFunction: Governmental Affairs & Regulatory Law
                    Description: The Affordable Care Act (ACA) is a United States federal statute signed into law by President Obama on March 23, 2010. The ACA was enacted to increase the quality and affordability of health insurance, lower the uninsured rate by expanding public and private insurance coverage, and reduce the costs of healthcare for individuals and the government.
                  - Name: Android Push Notifications
                    Category: Mobile Devices
                    Department: Information Technology
                    JobFunction: Cloud / Mobility
                    Description: Android Push Notifications is a message that pops up on the user's device. Notifications can be triggered locally by an open application, or they can be ""pushed"" from the server to the user even when the app is not running. They allow your users to opt-in to timely updates and allow you to effectively re-engage users with customized content.
                  - Name: Claims Processing
                    Category: Compensation & Benefits
                    Department: Medical & Health
                    JobFunction: Medical Administration
                    Description: Claims processing refers to the insurance company's procedure to check the claim requests for adequate information, validation, justification and authenticity.
                  - Name: Cloud Applications
                    Category: Cloud
                    Department: Information Technology
                    JobFunction: Cloud / Mobility
                    Description: Cloud application or cloud app is a software program where cloud-based and local components work together.
                  - Name: Cloud Computing
                    Category: Cloud
                    Department: Information Technology
                    JobFunction: Cloud / Mobility
                    Description: Cloud computing is a general term for anything that involves delivering hosted services over the internet.
                  - Name: Cloud Infrastructure
                    Category: Cloud
                    Department: Information Technology
                    JobFunction: Cloud / Mobility
                    Description: Cloud infrastructure is a term used to describe the components needed for cloud computing, which includes hardware, abstracted resources, storage, and network resources. Think of cloud infrastructure as the tools needed to build a cloud. In order to host services and applications in the cloud, you need cloud infrastructure.
                  - Name: Corporate Culture
                    Category: Company Culture & Policy
                    Department: Human Resources
                    JobFunction: Organizational Development
                    Description: Corporate culture is the shared values, attitudes, standards, and beliefs that characterize members of an organization and define its nature. It is rooted in an organization's goals, strategies, structure, and approaches to labor, customers, investors, and the greater community.
                  - Name: Credit Card Fraud
                    Category: Banking
                    Department: Finance
                    JobFunction: Risk
                    Description: Credit card fraud is an inclusive term for fraud committed using a payment card, such as a credit card or debit card. The purpose may be to obtain goods or services, or to make payment to another account which is controlled by a criminal.
                  - Name: Direct Deposit
                    Category: Billing & Invoice
                    Department: Finance
                    JobFunction: Finance
                    Description: Direct deposit or direct credit, in banking, is a deposit of money by a payer directly into a payee's bank account. Direct deposits are most commonly made by businesses in the payment of salaries and wages and for the payment of suppliers' accounts, but the facility can be used for payments, such as payment of bills, taxes, and other government charges.
                  - Name: eFulfillment Service
                    Category: Logistics / Supply Chain
                    Department: Operations
                    JobFunction: Logistics
                    Description: eFulfillment Service (EFS) is a process of making order fulfillment fast, easy and affordable for sellers of all types and sizes.
                  - Name: Google Search
                    Category: Search
                    Department: Information Technology
                    JobFunction: Collaboration & Web Apps
                    Description: Google Search, also referred to as Google Web Search or simply Google, is a web search engine developed by Google.
                  - Name: Healthcare Law
                    Category: Regulations
                    Department: Legal
                    JobFunction: Governmental Affairs & Regulatory Law
                    Description: Healthcare law concerns who can receive healthcare, and who should pay for it. This is a surprisingly complicated area of law given how expensive healthcare can be in the United States.
                  - Name: Hours of Work
                    Category: Labor & Employment Policy
                    Department: Human Resources
                    JobFunction: Human Resources
                    Description: Hours of Work is the period of time during which one engages in paid work. It is one way to measure the labor a person performs.
                  - Name: In-App Advertising
                    Category: Advertising
                    Department: Marketing
                    JobFunction: Advertising
                    Description: In-app advertising is an effective monetization strategy for mobile publishers, in which app developers get paid to serve advertisements within their mobile app.
                  - Name: Incentive Compensation
                    Category: Compensation & Benefits
                    Department: Human Resources
                    JobFunction: Compensation & Benefits
                    Description: Incentive compensation is a type of compensation based on the performance of an entity. Often incentive compensation plans are designed to attract and retain key employees, identify with shareholders, and align interests of employees and the company.
                  - Name: Java
                    Category: Application Development
                    Department: Engineering & Technical
                    JobFunction: Software Development
                    Description: Java is a widely used programming language expressly designed for use in the distributed environment of the internet. It is the programming language for Android smartphone applications.
                  - Name: Legal
                    Category: Legal Operations
                    Department: Legal
                    JobFunction: Legal
                    Description: Legal is used to describe things that relate to the law.
                  - Name: Mobile / Wireless
                    Category: Mobile Devices
                    Department: Information Technology
                    JobFunction: Cloud / Mobility
                    Description: Transmission over the air from a base station to a moving cellphone, tablet or laptop. The term may refer to voice only or voice and data.
                  - Name: Mobile Apps
                    Category: Mobile Applications
                    Department: Information Technology
                    JobFunction: Cloud / Mobility
                    Description: Mobile application is a computer program or software application designed to run on a mobile device such as a phone, tablet, or watch.
                  - Name: Mobile Security
                    Category: Cyber Security
                    Department: Information Technology
                    JobFunction: Information Security
                    Description: Mobile security involves protecting both personal and business information stored on and transmitted from smartphones, tablets, laptops and other mobile devices. The term mobile security is a broad one that covers everything from protecting mobile devices from malware threats to reducing risks and securing mobile devices and their data in the case of theft, unauthorized access or accidental loss of the mobile device.
                  - Name: Mobile Wallet
                    Category: Mobile Applications
                    Department: Information Technology
                    JobFunction: Cloud / Mobility
                    Description: Mobile wallet is a virtual wallet that stores payment card information on a mobile device. Mobile wallets are a convenient way for a user to make in-store payments and can be used at merchants listed with the mobile wallet service provider.
                  - Name: Node.js
                    Category: Application Development
                    Department: Engineering & Technical
                    JobFunction: Software Development
                    Description: Node.js is an open-source, cross-platform, JavaScript runtime environment that executes JavaScript code outside of a browser.
                  - Name: Organizational Culture
                    Category: Company Culture & Policy
                    Department: Human Resources
                    JobFunction: Organizational Development
                    Description: Organizational culture is defined as the underlying beliefs, assumptions, values and ways of interacting that contribute to the unique social and psychological environment of an organization.
                  - Name: Risk Management Services
                    Category: Risk
                    Department: Human Resources
                    JobFunction: Human Resources
                    Description: Risk management is the identification, evaluation, and prioritization of risks followed by coordinated and economical application of resources to minimize, monitor, and control the probability or impact of unfortunate events or to maximize the realization of opportunities.
                  - Name: Video Conferencing
                    Category: Collaboration/Web Apps
                    Department: Information Technology
                    JobFunction: Collaboration & Web Apps
                    Description: Video conferencing is a technology that allows users in different locations to hold face-to-face meetings without having to move to a single location together.
                contentMediaType: application/json;charset=utf-8
              example:
              - Name: Affordable Care Act (ACA)
                Category: Compensation & Benefits
                Department: Legal
                JobFunction: Governmental Affairs & Regulatory Law
                Description: The Affordable Care Act (ACA) is a United States federal statute signed into law by President Obama on March 23, 2010. The ACA was enacted to increase the quality and affordability of health insurance, lower the uninsured rate by expanding public and private insurance coverage, and reduce the costs of healthcare for individuals and the government.
              - Name: Android Push Notifications
                Category: Mobile Devices
                Department: Information Technology
                JobFunction: Cloud / Mobility
                Description: Android Push Notifications is a message that pops up on the user's device. Notifications can be triggered locally by an open application, or they can be ""pushed"" from the server to the user even when the app is not running. They allow your users to opt-in to timely updates and allow you to effectively re-engage users with customized content.
              - Name: Claims Processing
                Category: Compensation & Benefits
                Department: Medical & Health
                JobFunction: Medical Administration
                Description: Claims processing refers to the insurance company's procedure to check the claim requests for adequate information, validation, justification and authenticity.
              - Name: Cloud Applications
                Category: Cloud
                Department: Information Technology
                JobFunction: Cloud / Mobility
                Description: Cloud application or cloud app is a software program where cloud-based and local components work together.
              - Name: Cloud Computing
                Category: Cloud
                Department: Information Technology
                JobFunction: Cloud / Mobility
                Description: Cloud computing is a general term for anything that involves delivering hosted services over the internet.
              - Name: Cloud Infrastructure
                Category: Cloud
                Department: Information Technology
                JobFunction: Cloud / Mobility
                Description: Cloud infrastructure is a term used to describe the components needed for cloud computing, which includes hardware, abstracted resources, storage, and network resources. Think of cloud infrastructure as the tools needed to build a cloud. In order to host services and applications in the cloud, you need cloud infrastructure.
              - Name: Corporate Culture
                Category: Company Culture & Policy
                Department: Human Resources
                JobFunction: Organizational Development
                Description: Corporate culture is the shared values, attitudes, standards, and beliefs that characterize members of an organization and define its nature. It is rooted in an organization's goals, strategies, structure, and approaches to labor, customers, investors, and the greater community.
              - Name: Credit Card Fraud
                Category: Banking
                Department: Finance
                JobFunction: Risk
                Description: Credit card fraud is an inclusive term for fraud committed using a payment card, such as a credit card or debit card. The purpose may be to obtain goods or services, or to make payment to another account which is controlled by a criminal.
              - Name: Direct Deposit
                Category: Billing & Invoice
                Department: Finance
                JobFunction: Finance
                Description: Direct deposit or direct credit, in banking, is a deposit of money by a payer directly into a payee's bank account. Direct deposits are most commonly made by businesses in the payment of salaries and wages and for the payment of suppliers' accounts, but the facility can be used for payments, such as payment of bills, taxes, and other government charges.
              - Name: eFulfillment Service
                Category: Logistics / Supply Chain
                Department: Operations
                JobFunction: Logistics
                Description: eFulfillment Service (EFS) is a process of making order fulfillment fast, easy and affordable for sellers of all types and sizes.
              - Name: Google Search
                Category: Search
                Department: Information Technology
                JobFunction: Collaboration & Web Apps
                Description: Google Search, also referred to as Google Web Search or simply Google, is a web search engine developed by Google.
              - Name: Healthcare Law
                Category: Regulations
                Department: Legal
                JobFunction: Governmental Affairs & Regulatory Law
                Description: Healthcare law concerns who can receive healthcare, and who should pay for it. This is a surprisingly complicated area of law given how expensive healthcare can be in the United States.
              - Name: Hours of Work
                Category: Labor & Employment Policy
                Department: Human Resources
                JobFunction: Human Resources
                Description: Hours of Work is the period of time during which one engages in paid work. It is one way to measure the labor a person performs.
              - Name: In-App Advertising
                Category: Advertising
                Department: Marketing
                JobFunction: Advertising
                Description: In-app advertising is an effective monetization strategy for mobile publishers, in which app developers get paid to serve advertisements within their mobile app.
              - Name: Incentive Compensation
                Category: Compensation & Benefits
                Department: Human Resources
                JobFunction: Compensation & Benefits
                Description: Incentive compensation is a type of compensation based on the performance of an entity. Often incentive compensation plans are designed to attract and retain key employees, identify with shareholders, and align interests of employees and the company.
              - Name: Java
                Category: Application Development
                Department: Engineering & Technical
                JobFunction: Software Development
                Description: Java is a widely used programming language expressly designed for use in the distributed environment of the internet. It is the programming language for Android smartphone applications.
              - Name: Legal
                Category: Legal Operations
                Department: Legal
                JobFunction: Legal
                Description: Legal is used to describe things that relate to the law.
              - Name: Mobile / Wireless
                Category: Mobile Devices
                Department: Information Technology
                JobFunction: Cloud / Mobility
                Description: Transmission over the air from a base station to a moving cellphone, tablet or laptop. The term may refer to voice only or voice and data.
              - Name: Mobile Apps
                Category: Mobile Applications
                Department: Information Technology
                JobFunction: Cloud / Mobility
                Description: Mobile application is a computer program or software application designed to run on a mobile device such as a phone, tablet, or watch.
              - Name: Mobile Security
                Category: Cyber Security
                Department: Information Technology
                JobFunction: Information Security
                Description: Mobile security involves protecting both personal and business information stored on and transmitted from smartphones, tablets, laptops and other mobile devices. The term mobile security is a broad one that covers everything from protecting mobile devices from malware threats to reducing risks and securing mobile devices and their data in the case of theft, unauthorized access or accidental loss of the mobile device.
              - Name: Mobile Wallet
                Category: Mobile Applications
                Department: Information Technology
                JobFunction: Cloud / Mobility
                Description: Mobile wallet is a virtual wallet that stores payment card information on a mobile device. Mobile wallets are a convenient way for a user to make in-store payments and can be used at merchants listed with the mobile wallet service provider.
              - Name: Node.js
                Category: Application Development
                Department: Engineering & Technical
                JobFunction: Software Development
                Description: Node.js is an open-source, cross-platform, JavaScript runtime environment that executes JavaScript code outside of a browser.
              - Name: Organizational Culture
                Category: Company Culture & Policy
                Department: Human Resources
                JobFunction: Organizational Development
                Description: Organizational culture is defined as the underlying beliefs, assumptions, values and ways of interacting that contribute to the unique social and psychological environment of an organization.
              - Name: Risk Management Services
                Category: Risk
                Department: Human Resources
                JobFunction: Human Resources
                Description: Risk management is the identification, evaluation, and prioritization of risks followed by coordinated and economical application of resources to minimize, monitor, and control the probability or impact of unfortunate events or to maximize the realization of opportunities.
              - Name: Video Conferencing
                Category: Collaboration/Web Apps
                Department: Information Technology
                JobFunction: Collaboration & Web Apps
                Description: Video conferencing is a technology that allows users in different locations to hold face-to-face meetings without having to move to a single location together.
