        in: query
        required: true
        description: The entity type to filter by. Options are 'contact', 'company', 'scoop', 'news', or 'intent'.
        schema:
          $ref: '#/components/schemas/SearchEntityNameEnum'
        explode: false
      - name: filter[fieldType]
        in: query
        required: true
        description: The field type to filter by. Options are 'input' or 'output'.
        schema:
          $ref: '#/components/schemas/FieldTypeEnum'
        explode: false
      responses:
        '200':
          description: Success
          content:
            application/vnd.api+json:
