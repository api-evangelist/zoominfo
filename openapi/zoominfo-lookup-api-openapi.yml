  /lookup/companyranking:
    parameters: []
    get:
      tags:
      - Lookup
      summary: Zoominfo Company Ranking
      description: Retrieve accepted Company Ranking values
      operationId: CompanyRanking
      parameters: []
      responses:
        '200':
          description: OK
          headers:
            Date:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Tue, 17 Sep 2019 15:03:51 GMT
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
            Connection:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: keep-alive
            Content-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: gzip
            CF-Ray:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 517bf8185879ae06-BOS
            Expect-CT:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: max-age=604800, report-uri="https://report-uri.cloudflare.com/cdn-cgi/beacon/expect-ct"
            Set-Cookie:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: _pxhd=65d3624b622354d497d15cd8f518d9003708630dad6c7226d0b798c059302a3a:97799611-d95b-11e9-9c4e-21d6673962fa; path=/;
            vary:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Accept-Encoding
            Via:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: 1.1 google, 1.1 google
            x-application-context:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: application:production:8080
            X-RateLimit-Limit:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '1000'
            X-RateLimit-Remaining:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '999'
            X-RateLimit-Reset:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: '1568732631'
            Server:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: cloudflare
          content:
            application/json;charset=utf-8:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetCompanyRanking'
                description: ''
                examples:
                - - Id: fortune100
                    Name: Fortune 100
                  - Id: fortune500
                    Name: Fortune 500
                  - Id: fortune1000
                    Name: Fortune 1000
                  - Id: global500
                    Name: Global 500
                  - Id: private500
                    Name: America's Largest
                  - Id: russell3000
                    Name: Russell 3000
                contentMediaType: application/json;charset=utf-8
              example:
              - Id: fortune100
                Name: Fortune 100
              - Id: fortune500
                Name: Fortune 500
              - Id: fortune1000
                Name: Fortune 1000
              - Id: global500
                Name: Global 500
              - Id: private500
