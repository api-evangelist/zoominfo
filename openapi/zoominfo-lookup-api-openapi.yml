                  value:
                    data:
                    - attributes:
                        name: Divestiture
                      id: '5'
                      type: ScoopType
                Look up SIC codes:
                  summary: Look up SIC codes
                  description: This example demonstrates how to look up SIC codes using the API. The response includes a sample SIC code.
                  value:
                    data:
                    - attributes:
                        name: Rice
                      id: '0112'
                      type: SICCode
                Look up states:
                  summary: Look up states
                  description: This example demonstrates how to look up states using the ZoomInfo API. The response includes a sample state.
                  value:
                    data:
                    - attributes:
                        name: Alaska
                      id: usa.alaska
