                  value:
                    data:
                    - attributes:
                        name: Soybean Farming
                      id: '11111'
                      type: NAICSCode
                Look up news categories:
                  summary: Look up news categories
                  description: This example demonstrates how to look up news categories using the API. The response includes a sample news category.
                  value:
                    data:
                    - attributes:
                        name: GENERAL_NEWS
                      id: GENERAL_NEWS
                      type: NewsCategory
                Look up revenue ranges:
                  summary: Look up revenue ranges
                  description: This example demonstrates how to look up revenue ranges using the API. The response includes a sample revenue range.
                  value:
                    data:
                    - attributes:
                        name: '500'
                      id: under500k
                      type: RevenueRange
                Look up scoop departments:
                  summary: Look up scoop departments
                  description: This example demonstrates how to look up scoop departments using the API. The response includes a sample scoop department.
                  value:
                    data:
                    - attributes:
                        name: Sales
                      id: '5'
                      type: ScoopDepartment
                Look up scoop topics:
                  summary: Look up scoop topics
                  description: This example demonstrates how to look up scoop topics using the API. The response includes a sample scoop topic.
                  value:
                    data:
                    - attributes:
                        name: Award
                      id: '5'
