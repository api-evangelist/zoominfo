      description: "Use Bulk Contact Search to retrieve contacts using valid query parameters. Your request can consist of the following parameters:\n\n| Parameter | Description |\n| --- | --- |\n| jobType | Can be `preview` (default) or `redeem` |\n| query | Can consist of valid input fields from the [Contact Search Inputs](#74630827-dd25-4b6a-bf72-f7cfeffd6c41) endpoint to retrieve the desired results. The following fields are currently not supported with Bulk Search: `sortOrder` and `sortBy`. |\n| outputFields | Required for the `redeem` job type only. Specify the desired output fields to return. See the [Contact Enrich Outputs](#28b47784-3186-4fc4-af91-12e6bc6fb31a) endpoint for the list of output fields you can request. The following fields are currently not supported as an output for Bulk Search: `companyDescriptionList`. |\n\nSee the preview and redeem request examples for syntax.\n\nThe expected output in all cases is a `jobId`. For example:\n\n```\n{\n   \"jobId\": \"e97813aa0bcae7a66f2ea9e1b69a0da2057bbfd8\"\n}\n\n```\n\nSee the [Bulk Job Status](#1f6246d0-fd13-4f63-b170-dda2fedd8322) and [Bulk Job Results](#5417ba88-096d-448a-b6cd-b930089c678d) endpoints for details on how to use the `jobId` to preview and return results."
