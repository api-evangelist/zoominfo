  /webhooks/967763288:
    parameters: []
    put:
      tags:
      - Monitoring API/Webhooks
      summary: Zoominfo Update Webhook
      description: "Use this endpoint to update an existing webhook, including its enabled status, target URL, and subscription details.\n\nSpecify the webhook by appending the webhook `id` in the request URL. For example:\n\n`https://api.zoominfo.com/webhooks/213786430`\n\nWhen using the Update Webhook endpoint, values you provide in the JSON body of your request overwrite values in the existing webhook. Common scenarios for using this endpoint include the following.\n\n**Enable a webhook**\n\nAs described in the [Create Webhook](#6cbb2c08-cb50-4b15-9a01-a2d0d3dabaa1) endpoint, we recommend initially configuring a new webhook as disabled so you can ensure the target URL is reachable, and the verification token is in place in your integrated app. Once these tasks are complete, you can use the Update Webhook endpoint to enable the webhook.\n\nFor example, send a request specifying the webhook `id` in the URL to change the `enabled` value to `true`:\n\nRequest URL:\n\n`https://api.zoominfo.com/webhooks/{webhook_id}`\n\nJSON body:\n\n```\n{\n    \"enabled\": true\n}\n\n```\n\n**Update webhook subscription details**\n\nExample: Your webhook has a subscription with the `objectType` set to `Company`, you can change it to `Contact` using the Update Webhook endpoint.\n\nRequest URL:\n\n`https://api.zoominfo.com/webhooks/{webhook_id}`\n\nJSON body:\n\n```\n{\n    \"subscriptions\": [\n        {\n            \"subscriptionId\": \"393093719\",\n            \"eventType\": \"Update\",\n            \"objectType\": \"Contact\"\n        }\n    ]\n} \n\n```\n\n**Add a new objectType to a subscription**\n\nExample: Your webhook has a subscription that includes only the `Contact` `objectType`. You can add the `Company` `objectType` to the subscription.\n\nRequest URL:\n\n`https://api.zoominfo.com/webhooks/{webhook_id}`\n\nJSON body:\n\n```\n{\n    \"subscriptions\": [\n        {\n            \"eventType\": \"Update\",\n            \"objectType\": \"Company\"\n        }\n    ]\n} \n\n```\n\n**Delete a subscription**\n\nYou can delete a subscription by simply sending the `subscriptionId` in your request without specifying any subscription parameters.\n\nRequest URL:\n\n`https://api.zoominfo.com/webhooks/{webhook_id}`\n\nJSON body:\n\n```\n{\n    \"subscriptions\": [\n        {\n            \"subscriptionId\": \"836880237\"\n        }\n    ]\n}\n\n```\n\n**Input params**\n\n| Parameter | DataType | Description |\n| --- | --- | --- |\n| title | String | Title for the webhook |\n| enabled | Boolean | Enable or disable the webhook |\n| targetUrl | String | Destination URL for the webhook data. Must be in `https://` format. |\n| subscriptions | ArrayList | Specify the `eventType` and `objectType` for the webhook |\n\n**Output fields**\n\n| Field | Description |\n| --- | --- |\n| id | Unique ZoomInfo identifier for the webhook |\n| title | Title for the webhook |\n| enabled | Displays whether the webhook is enabled or disabled |\n| targetUrl | Destination URL for the webhook data |\n| createdDate | Timestamp for when the webhook was created |\n| verificationToken | Verification token generated when the webhook was created |\n| subscriptions | List of subscriptions. Each subscription includes the `createdDate`, `modifiedDate`, `eventType`, `objectType` and a unique `subscriptionId`. |"
      operationId: UpdateWebhook
      parameters: []
      requestBody:
        description: ''
        content:
