                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: Thu, 18 Feb 2021 14:56:58 GMT
            Transfer-Encoding:
              content:
                text/plain:
                  schema:
                    type: string
                    contentMediaType: text/plain
                  example: chunked
            Connection:
              content:
                text/plain:
                  schema:
