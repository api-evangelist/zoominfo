      summary: Zoominfo Scoop Search Inputs
      description: Returns a list of fields you can use as input for the [Scoop Search](#3099d72f-6857-4432-89c2-736410680e60) endpoint.
      operationId: ScoopSearchInputs
      parameters: []
      responses:
        '200':
          description: OK
