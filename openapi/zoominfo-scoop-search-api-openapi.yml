                    description: Company state
                  - fieldName: zipCode
                    fieldType: String
                    description: Zip Code of the company's primary address
                  - fieldName: country
                    fieldType: String
                    description: Company country
                  - fieldName: continent
                    fieldType: String
                    description: Company continent
                  - fieldName: zipCodeRadiusMiles
                    fieldType: String
                    description: Used in conjunction with zipCode, designates a geographical radius (in miles) from the zipCode provided.
                  - fieldName: hashTagString
                    fieldType: String
                    description: Hash tags for a company. Can include a comma-separated list.
                  - fieldName: techAttributeTagList
                    fieldType: String
                    description: Specify technology product tags
                  - fieldName: subUnitTypes
                    fieldType: String
                    description: Company sub types (e.g., division, subsidiary and so on).
                  - fieldName: primaryIndustriesOnly
                    fieldType: Boolean
                    description: Used in conjunction with the industryCodes input parameter. When set to true, any result returned must have one of the specified industries in the top two. If no industries are specified, then this parameter will be ignored. Default is false.
                  - fieldName: industryCodes
                    fieldType: String
                    description: Top-level industry that the contact works in. A contact can have multiple top level industries. Tags are based on the contact's current company. Can include a comma-separated list.
                  - fieldName: industryKeywords
                    fieldType: String
                    description: Industry keywords associated with a company. Can include a comma-separated list.
                  - fieldName: sicCodes
                    fieldType: String
                    description: Four-digit numerical codes assigned by the U.S. government to business establishments to identify the primary business of the establishment.
                  - fieldName: naicsCodes
                    fieldType: String
                    description: 'Four-digit numerical codes assigned by the U.S. government to business establishments to identify the primary business of the establishment. '
                  - fieldName: revenueMin
                    fieldType: Integer
                    description: Minimum annual revenue for a company in U.S. dollars. Use with revenueMax to set a range. Alternatively, you can use the revenue parameter to search for pre-defined ranges.
                  - fieldName: revenueMax
                    fieldType: Integer
                    description: Maximum annual revenue for a company in U.S. dollars. Use with revenueMin to set a range. Alternatively, you can use the revenue parameter to search for pre-defined ranges.
                  - fieldName: revenue
                    fieldType: String
                    description: Annual revenue range in U.S. dollars. Accepts a comma-separated list of values. Alternatively, to get more granular ranges, you can use the revenueMin and revenueMax parameters.
                  - fieldName: employeeRangeMin
                    fieldType: String
                    description: Minimum employee count for a company. Use with employeeRangeMax to set a range. Alternatively, you can use the employeeCount parameter to search for pre-defined ranges.
