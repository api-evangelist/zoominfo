- name: Technology Enrich
  description: 'Use [Technology Enrich](#9fc40c02-fe95-448f-a6f4-e903c85c81a9) to retrieve company technology detail using valid query parameters.


    Refer to the examples provided to build a valid JSON request. Use the [Technology Enrich Inputs](#2cc6abbc-e782-4ab4-80e8-ce29ed17ee4e) endpoint to retrieve a list of valid input parameters you can provide.'
paths:
  /enrich/tech:
    parameters: []
    post:
      tags:
      - Technology Enrich
      summary: Zoominfo Technology Enrich
      description: 'Use this endpoint to match technology information based on [input values](#2cc6abbc-e782-4ab4-80e8-ce29ed17ee4e) and return output fields in the response.


        **Input params**


        | Parameter | DataType | Description |

        | --- | --- | --- |

        | companyId | String | Required. The ID of the company for which you want to find technologies. |


        **Output fields**


        | Field | Description |

        | --- | --- |

        | tag | Unique tag ID for a given technology |

        | categoryParent | Technology category parent |

        | category | Technology category |

        | vendor | Technology vendor |

        | product | Technology product |

        | website | Technology website |

        | logo | Technology logo |

        | domain | Vendor domain |

        | createdTime | Date the vendor was created |

        | modifiedTime | Date the vendor was modified |

        | description | Technology description |'
      operationId: TechnologyEnrich
      parameters: []
