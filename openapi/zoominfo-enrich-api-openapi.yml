                    - type: Hashtag
                      id: '#250_plus_operations'
                      attributes:
                        categorizedFlag: false
                        description: This company has 250 or more employees in an operations role
                        displayLabel: 250+ Operations Employees
                        displayScore: 'yes'
                        group: Number of Operations Employees
                        hidden: false
                        label: 250+ Operations Employees
                        parentCategory: Job Function
                        priority: 250
                        searchString: 250 operations employees
