      required:
      - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ContactEnrichResponseResourceUnion'
          description: The primary data of the document
      description: Contact enrich response.
    ScoopContact:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Unique ZoomInfo identifier for a person.
        firstName:
          type: string
          description: Contact first name.
        lastName:
          type: string
          description: Contact last name.
        jobTitle:
          type: string
          description: Contact job title at current place of employment.
        jobFunction:
          type: array
          items:
            $ref: '#/components/schemas/JobFunction'
          description: Contact job function at their current place of employment.
      description: ScoopContact
    CompanyEnrichResponseResourceUnion:
      type: object
      oneOf:
      - $ref: '#/components/schemas/EnrichCompany'
      - $ref: '#/components/schemas/NoMatchCompany'
      discriminator:
        propertyName: type
        mapping:
          Company: '#/components/schemas/EnrichCompany'
          NoMatch: '#/components/schemas/NoMatchCompany'
      description: Represents the possible resource types returned in a company enrich response, including both a successful company match and a no-match result. Used to encapsulate the response resource for company enrichment.
    NonPaginatedResultMeta:
      type: object
      required:
      - totalResults
      properties:
        totalResults:
          type: integer
          format: uint32
          description: The total number of results based on the specified filters
      description: Metadata for non-paginated results, including the total number of results
    CorporateHierarchyEnrichRequestResource:
      type: object
      required:
      - type
      - attributes
      properties:
        type:
          type: string
          description: The type of the resource
          default: CorporateHierarchyEnrich
          pattern: CorporateHierarchyEnrich
        attributes:
          allOf:
          - $ref: '#/components/schemas/CorporateHierarchyEnrichRequestAttributes'
          description: The attributes defining the resource
      description: Corporate hierarchy enrich request resource.
  securitySchemes:
    OAuth2Auth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.zoominfo.com
          tokenUrl: https://okta-login.zoominfo.com/oauth2/default/v1/token
          scopes:
            api:data:contact: Ability to search and enrich ZoomInfo Contact data
            api:data:company: Ability to search and enrich ZoomInfo Company data
            api:data:intent: Ability to search and enrich ZoomInfo Intent data
            api:data:news: Ability to search and enrich ZoomInfo News data
            api:data:scoops: Ability to search and enrich ZoomInfo Scoop data
            api:data:lookup: Lookup ZoomInfo Data
