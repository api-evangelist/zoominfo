- aid: zoominfo:zoominfo-company-search-api
  name: ZoomInfo Company Search API
  description: >-
    Use [Company Search](#4506f0ad-9147-4016-991f-ce8ef6700f07) to retrieve company data using valid query
    parameters.


    *   To build your request, retrieve a list of valid query parameters using [Company Search Inputs](#ffd4ccc6-09d1-4026-8c4f-863d02fd703e).

    *   For requests that require you to specify supported values (e.g., company type, industry codes
    and so on), use the [Lookup](#efe7b4b8-1ef2-4fcd-a20f-9da68f6b2055) endpoints.

    *   Use [Company Search Outputs](#3dd35354-8523-4a8c-935a-97ed56d059a6) to retrieve a list of expected
    response fields that will be returned from [Company Search](#4506f0ad-9147-4016-991f-ce8ef6700f07).
