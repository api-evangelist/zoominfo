- aid: zoominfo:zoominfo-contact-enrich-api
  name: ZoomInfo Contact Enrich API
  description: >-
    Use [Contact Enrich](#c145dd01-eb54-4fc2-bbdb-9edc04b7ea1b) to retrieve contact detail using valid
    query parameters. A Contact Enrich request requires you to specify both input parameters about the
    contact you are enriching, and the output fields you want to retrieve.


    Refer to the examples provided to build a valid JSON request. For supported input and output parameters:


    *   Use the [Contact Enrich Inputs](#dbaf31cd-0f7a-4bf3-b6c1-077f3c31f2df) endpoint to retrieve a
    list of valid input parameters you can provide

    *   Use the [Contact Enrich Outputs](#28b47784-3186-4fc4-af91-12e6bc6fb31a) endpoint to retrieve a
    list of valid output fields that can be returned
