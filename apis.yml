position: Consuming
description: >-
  ZoomInfo is a B2B go-to-market intelligence platform whose contact and company database,
  buyer-intent signals, scoops and news feeds are sold to sales, marketing, operations and
  recruiting teams. Its API estate is mid-migration: the legacy Enterprise API on
  api.zoominfo.com is documented as deprecating, while the current GTM API on
  api.zoominfo.com/gtm ships six published OpenAPI specifications covering data, Copilot,
  GTM Studio, marketing, agents and platform. ZoomInfo also operates a hosted, OAuth-gated
  Model Context Protocol server at mcp.zoominfo.com and publishes 35 agent skills and a
  first-party CLI that talks to that MCP server rather than to REST.
