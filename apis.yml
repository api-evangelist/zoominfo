    phone\": \"(360) 783-6816\",\n      \"directPhoneDoNotCall\": false,\n      \"street\": \"805 Broadway\
    \ St Ste 900\",\n      \"city\": \"Vancouver\",\n      \"region\": \"Washington\",\n      \"metroArea\"\
    : \"Portland\",\n      \"zipCode\": \"98660\",\n      \"state\": \"Washington\",\n      \"country\"\
    : \"United States\",\n      \"continent\": \"North America\",\n      \"personHasMoved\": \"Uncertain\"\
