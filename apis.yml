- aid: zoominfo:zoominfo-bulk-api
  name: ZoomInfo Bulk API
  description: "Use the Bulk APIs to search, retrieve, and enrich large ZoomInfo company and contact datasets\
    \ through asynchronous batch processes.\n\nWith 20x more records than Contact and Company Search and\
    \ 400x more records than the Contact and Company Enrich, you can leverage Bulk APIs for data ingestion\
    \ and enrichment at scale.\n\n**Bulk Search API**\n\nWith the Bulk Search API you can:\n\n*   Search\
    \ for up to 200K records with a single search query\n*   Preview or redeem up to 500 records per page\n\
    \    \n\nTwo job types are available with the Bulk Search APIs:\n\n*   The Preview job type returns\
    \ a company or contact search results preview to help identify records best suited for enrichment.\
    \ Credits are not charged for the Preview job type.\n*   The Redeem job type enables data retrieval\
    \ for ingestion, returning selected output fields for a given contact or company. A credit is charged\
    \ for each unique record that is redeemed.\n    \n\nWhen you submit a search request, an asynchronous\
    \ job is started, and a job_id is instantly returned. You can use the job_id to check the status of\
    \ the job and retrieve results.\n\n**Bulk Enrich API**\n\nWith the Bulk Enrich API you can:\n\n* \
    \  Enrich up to 10K records in a single job\n*   Retrieve up to 500 results per page\n    \n\nWhen\
    \ you submit an enrich request, an asynchronous job is started, and a job_id is instantly returned.\
    \ You can use the job_id to check the status of the job and enrich results.\n\n**Rate Limiting**\n\
    \n*   You can have up to 5 \"active\" jobs (Jobs that are in progress are active jobs. Once a job\
    \ is completed, you can proceed to creating another job)\n*   You can create up to 1 job per second\n\
    *   Each job you create expires after 24 hours"
