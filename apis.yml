aid: zoominfo
url: https://raw.githubusercontent.com/api-evangelist/zoominfo/refs/heads/main/apis.yml
apis:
- aid: zoominfo:zoominfo-authentication-api
  name: ZoomInfo Authentication API
  description: >-
    The ZoomInfo API authenticates client access requests using a JSON Web Token (JWT). A JWT is a string
    that is generated by the server for the client that can then be passed along in an HTTPS request.


    **Note**: The Authenticate endpoint is one method for authenticating with the ZoomInfo API with a
    username and password. For other methods that utilize public libraries for Java, Python, and NodeJS,
    see the 'Authentication methods' section in the [ZoomInfo API introduction](#intro).


    To obtain the token, the client exchanges valid user credentials with the server which generates the
    token and provides it back to the client. An access token generally has a set expiration time after
    which a new token will need to be requested by the client.


    Use the Authenticate endpoint to pass valid ZoomInfo user credentials to the API. If authentication
    is successful, a JWT access token is provided in the response body.


    **Important: The token is good for 60 minutes from the time that the response was generated.**


    *   **Do not generate a new JWT with every call/request.**

    *   **As a best practice to keep the session active, refresh the JWT every 55 minutes.**
  humanURL: https://www.zoominfo.com/
  baseURL: https://api.zoominfo.com
  tags:
  - Authentication
