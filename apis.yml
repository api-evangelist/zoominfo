- type: Features
  data:
  - name: Contact Search
    description: Search for contacts by job title, company, location, industry, and
      other criteria
  - name: Company Search
    description: Search for companies by industry, revenue, employee count, location,
      and technology stack
  - name: Contact Enrichment
    description: Enrich contact records with verified email addresses, phone numbers,
      and professional details
  - name: Company Enrichment
    description: Enrich company records with firmographic data including revenue,
      employee count, and technographics
  - name: Intent Data
    description: Identify companies showing buying intent signals based on content
      consumption patterns
  - name: Scoops
    description: Access business intelligence scoops about company changes, hiring,
      and strategic initiatives
  - name: News Intelligence
    description: Search and enrich news articles related to companies and contacts
  - name: Technology Tracking
    description: Identify technologies used by companies across their tech stack
  - name: Corporate Hierarchy
    description: Map organizational structures including parent companies, subsidiaries,
      and divisions
  - name: Org Chart
    description: Access organizational chart data showing reporting relationships
      within companies
  - name: Webhooks
    description: Real-time notifications for data changes and updates via webhook
      subscriptions
  - name: Bulk Operations
    description: Submit batch search and enrichment jobs for large-scale data processing
  - name: WebSights
    description: Identify website visitors by IP address and enrich with company information
  - name: Compliance
    description: Access compliance data to support GDPR and privacy regulation requirements
- type: UseCases
  data:
  - name: Sales Prospecting
    description: Identify and prioritize ideal prospects using firmographic and intent
      data to build targeted sales pipelines
  - name: Lead Enrichment
    description: Automatically enrich inbound leads with verified contact and company
      data for faster qualification
  - name: Account-Based Marketing
    description: Build targeted account lists and personalize outreach using detailed
      company intelligence
  - name: CRM Data Hygiene
    description: Cleanse and update CRM records with accurate contact information
      and company details
  - name: Market Research
    description: Analyze market segments, technology adoption, and competitive landscapes
      using company data
  - name: Competitive Intelligence
    description: Monitor competitor activities, technology changes, and strategic
      moves through scoops and news
  - name: Buyer Intent Analysis
    description: Identify accounts actively researching solutions in your category
      based on intent signals
  - name: Website Visitor Identification
    description: Convert anonymous website traffic into identified company accounts
      using IP enrichment
- type: Integrations
  data:
  - name: Salesforce
    description: Native integration to enrich and sync contact and company data with
      Salesforce CRM
  - name: HubSpot
    description: Seamless integration to push enriched data into HubSpot CRM and marketing
      automation
  - name: Microsoft Dynamics 365
    description: Integration to enrich records and sync data with Microsoft Dynamics
      CRM
  - name: Marketo
    description: Marketing automation integration for lead enrichment and scoring
      with Marketo
  - name: Outreach
    description: Sales engagement platform integration for enriched prospect data
      in Outreach sequences
  - name: Salesloft
    description: Integration to power Salesloft cadences with verified contact information
  - name: Slack
    description: Notifications and alerts for intent signals and data updates delivered
      to Slack channels
  - name: Snowflake
    description: Data sharing integration to access ZoomInfo data directly in Snowflake
      data warehouse
  - name: Google Ads
    description: Audience targeting integration to reach ideal prospects with Google
      advertising campaigns
  - name: LinkedIn
    description: Integration to match and enrich LinkedIn profile data with ZoomInfo
      intelligence
