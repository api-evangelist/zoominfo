- aid: zoominfo:zoominfo-intent-search-api
  name: ZoomInfo Intent Search API
  description: >-
    Use [Intent Search](#93f940a4-4381-49dd-8fbc-42cbc75a7a39) to retrieve Intent-related data using valid
    query parameters.


    *   To build your request, retrieve a list of valid query parameters using [Intent Search Inputs](#14669274-88b8-4762-8d61-57d2fd5abf12).

    *   For requests that require you to specify supported values (e.g., Intent topics), use the [Lookup](#efe7b4b8-1ef2-4fcd-a20f-9da68f6b2055)
    endpoints.

    *   Use [Intent Search Outputs](#8f3540ee-4093-48e4-aebb-97133a864912) to retrieve a list of expected
    response fields that will be returned from [Intent Search](#93f940a4-4381-49dd-8fbc-42cbc75a7a39).
