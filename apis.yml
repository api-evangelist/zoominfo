- aid: zoominfo:zoominfo-websights-api-api
  name: ZoomInfo WebSights API API
  description: >-
    The Websights API identifies anonymous website traffic by resolving IP addresses (IPv4 & IPv6) to
    return company and ISP profiles and IP geolocation details.


    **Company vs. ISP response data**


    If the IP address belongs to a company, details about the company are returned including geolocation
    details. For example:


    ```

    "data": {
        "company": {
            "city": "Vancouver",
            "country": "United States",
            "employeeCount": 1300,
            "id": 344589814,
            "industries": [
                "media.data",
                "media",
                "software"
            ],
            "name": "Zoom Information, Inc.",
            "revenue": 400000,
            "state": "Washington",
            "street": "805 Broadway St Suite 900",
            "ticker": "",
            "website": "www.zoominfo.com",
           "zipCode": "98660"
        },
        "geoLocation": {
            "location_long": -122.672,
            "location_lat": 45.627,
            "country_code": "US",
            "province": "Washington"
        }

    ```


    If the IP address belongs to an internet service provider (ISP), details about the ISP are returned
    including geolocation details. For example:


    ```
        "data": {
            "geoLocation": {
                "location_long": -71.06616,
                "location_lat": 42.45843,
                "country_code": "US",
                "province": "Massachusetts"
            },
            "ispInfo": {
                "domain": "comcast.com",
                "ip_hi_string": "73.143.255.255",
                "ip_lo_string": "73.142.0.0",
                "name": "Comcast Cable Communications, Inc.",
                "type": "isp"
            }

    ```


    **Charging mechanism**


    Your account is provisioned with an allocated number of records that you can retrieve over a 1-year
    period. A record is either a company for which ZoomInfo has data, or an Internet Service Provider
    (ISP). If a query does not match a company or ISP, no record is charged.
