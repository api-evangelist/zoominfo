    Refer to the examples provided to build a valid JSON request:


    *   Use the [News Enrich Inputs](#d58425e5-a4a4-4af0-ad01-fa7bbf91ca84) endpoint to retrieve a list
    of valid input parameters you can provide

    *   Use the [News Enrich Outputs](#254b86e3-e51b-450d-8704-95e4da168874) endpoint to retrieve a list
    of valid output fields returned
