- aid: zoominfo:zoominfo-corporate-hierarchy-enrich-api
  name: ZoomInfo Corporate Hierarchy Enrich API
  description: >-
    Use [Corporate Hierarchy Enrich](#585acff6-f231-4109-b818-b2ff586c18d3) to retrieve corporate hierarchy
    detail using valid query parameters. A Corporate Hierarchy Enrich request requires you to specify
    both input parameters about the company you are enriching, and the output fields you want to retrieve.


    Refer to the examples provided to build a valid JSON request. For supported input and output parameters:


    *   Use the [Corporate Hierarchy Enrich Inputs](#d72da288-2069-47c9-b36f-16cdab5d9988) endpoint to
    retrieve a list of valid input parameters you can provide

    *   Use the [Corporate Hierarchy Enrich Outputs](#d6813026-dcae-4b20-9ee4-b1301451a2c7) endpoint to
    retrieve a list of valid output fields that can be returned
  humanURL: https://www.zoominfo.com/
  baseURL: https://api.zoominfo.com
