- aid: zoominfo:zoominfo-company-master-data-enrich-api
  name: ZoomInfo Company Master Data Enrich API
  description: >-
    The new [Company Master Data Enrich](#8b6cffe4-cb34-44ab-ad5d-1953d372ffd3) endpoint brings together
    ZoomInfo firmographic data with the EverString firmographic data along with significant improvements
    including additional firmographic attributes and enhanced data.


    Refer to the examples provided to build a valid JSON request. For supported input and output parameters:


    *   Use the [Company Master Enrich Inputs](#d305402c-33d1-488c-8b8f-b5b079868a61) endpoint to retrieve
    a list of valid input parameters you can provide

    *   Use the [Company Master Enrich Outputs](#58b47522-753a-4104-a0c6-454adf4b6a1d) endpoint to retrieve
    a list of valid output fields that can be returned
