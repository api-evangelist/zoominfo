- aid: zoominfo:zoominfo-scoop-search-api
  name: ZoomInfo Scoop Search API
  description: >-
    Use [Scoop Search](#3099d72f-6857-4432-89c2-736410680e60) to retrieve scoop-related data using valid
    query parameters.


    *   To build your request, retrieve a list of valid query parameters using [Scoop Search Inputs](#1888a5e1-6a96-4cc2-910b-70e574370996).

    *   For requests that require you to specify supported values (e.g., job titles, industry codes and
    so on), use the [Lookup](#efe7b4b8-1ef2-4fcd-a20f-9da68f6b2055) endpoints.

    *   Use [Scoop Search Outputs](#185aa18e-02fa-440e-a691-b8e2c391a456) to retrieve a list of expected
    response fields that will be returned from [Scoop Search](#3099d72f-6857-4432-89c2-736410680e60).
