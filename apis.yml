- aid: zoominfo:zoominfo-company-enrich-api
  name: ZoomInfo Company Enrich API
  description: >-
    Use [Company Enrich](#59a59d9e-7eb9-44fa-904a-f10f9ab7c5fd) to retrieve company detail using valid
    query parameters. A Company Enrich request requires you to specify both input parameters about the
    company you are enriching, and the output fields you want to retrieve.


    Refer to the examples provided to build a valid JSON request. For supported input and output parameters:


    *   Use the [Company Enrich Inputs](#7a915792-e8cd-4e3a-9f0e-c19b850be536) endpoint to retrieve a
    list of valid input parameters you can provide

    *   Use the [Company Enrich Outputs](#d05239c3-2597-45f8-9384-f2dbd3518cfc) endpoint to retrieve a
    list of valid output fields that can be returned
  humanURL: https://www.zoominfo.com/
  baseURL: https://api.zoominfo.com
  tags:
  - Company Enrich
  properties:
