- aid: zoominfo:zoominfo-monitoring-api-webhooks-api
  name: ZoomInfo Monitoring API/Webhooks API
  description: "ZoomInfo data is highly dynamic, with contacts, companies and related data being constantly\
    \ updated in real-time in our database. Naturally, our clients want these changes to be delivered\
    \ in real-time for the records they've already purchased using the ZoomInfo API - that's where webhooks\
    \ come in.\n\n## Why webhooks?\n\nOrganizations with ZoomInfo API access use the API's endpoints to\
    \ search for, export, and enrich records to their integrated applications. While you can regularly\
    \ poll for updates to contact and company records you've already enriched using the API, manually\
    \ querying the entire database is not the best use of your time. A more efficient method is to configure\
    \ webhooks to automatically update you when there is a change to a record youve purchased. Once configured,\
    \ Webhooks will listen for events you subscribe to and automatically send over all (or only relevant)\
    \ updates securely to your application.\n\n## Monitoring API/Webhooks basics\n\nAvailable to organizations\
    \ with the Scaling API, the Monitoring API is a set of endpoints that allows for the configuration\
    \ of webhooks subscriptions that specify:\n\n- **Webhook Title**: Name of the webhook.\n- **Subscription**:\
    \ The events you are listening for, consisting of object types and event types.\n    - **Object types**:\
    \ The types of records you want to update. Supported object types are Contact and Company.\n    -\
    \ **Event types**: The events that trigger a webhook's response. Currently, the only supported event\
    \ is Update.\n- **Changed attributes**: This is a JSON object that includes a list of fields that\
    \ are changed as part of a payload.\n- **Payload types (full payload/changed attributes only)**:\n\
    \    - A full payload (all fields for a contact or company, including changed attributes)\n    - Only\
    \ the changed attributes for a contact or company.\n- **Target URL**: The target URL to which the\
    \ webhook JSON payloads are sent.\n- **Verification Token**: Signature token that will be part of\
    \ the request we send to you.\n    \n\n## Securing the data transfer\n\nTo secure communication between\
    \ ZoomInfo and your app, a _verification token_ is generated when you create the webhook. When data\
    \ is sent to your target URL using a POST request, this verification token will be included in the\
    \ request header (_x-zoominfo-token_) and can be used in your app to authorize receipt of the data\
    \ from ZoomInfo.\n\nThe initial token is generated when you create a webhook. To maintain security\
    \ for your webhook over time, you can periodically generate a new verification token using the [Generate\
    \ Verification Token](#9cc75e99-622e-4aa2-b9a8-2d33d0ede2ed) webhook.\n\n## Considerations\n\nNote\
    \ the following considerations:\n\n- To use the Monitoring API/webhooks, you must have access to the\
    \ Scaling API.\n- To subscribe to events, you must have already enriched at least one contact or company\
    \ record using the API.\n- You will only receive updates on records that you've purchased using the\
    \ API within the past 12 months.\n- The default payload type for company or contact updates is the\
    \ full payload with changed attributes.\n    \n- The maximum number of profiles delivered in a single\
    \ webhook payload is 25.\n    \n\n## Payload examples\n\nHere are examples of the POST requests your\
    \ webhook's target URL will receive.\n\nFor contact and company records, you can choose to receive\
    \ a full payload of all possible fields for a record (including changed attributes), or a payload\
    \ including only the changed attributes for a record.\n\nIn either case (full or changed attributes\
    \ only), contact and company records will always include the following fields to support mapping the\
    \ profile:\n\n**Contacts**: `id`, `firstName`, `lastName`, and `email`\n\n**Companies**: `id`, `name`,\
    \ and `website`\n\nThe following examples are provided below:\n\n- Example 1: Contact record - full\
    \ profile (default)\n- Example 2: Contact record - changed attributes only\n- Example 3: Company record\
    \ - full profile (default)\n- Example 4: Company record - changed attributes only\n    \n\n**Example\
    \ 1: Contact record - full profile (default)**  \nIncludes all output fields\n\n``` json\n{\n  \"\
    webhookDetails\":\n  {\n    \"id\": \"xxxx\",\n    \"title\": \"webhook-title\",\n    \"objectType\"\
    : \"Contact\",\n    \"eventType\": \"Update\"\n  },\n  \"data\":\n  [\n    {\n      \"id\": 1260398587,\n\
    \      \"firstName\": \"Henry\",\n      \"middleName\": \"L.\",\n      \"lastName\": \"Schuck\",\n\
