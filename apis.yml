- aid: zoominfo:zoominfo-news-search-api
  name: ZoomInfo News Search API
  description: >-
    Use [News Search](#4c4c979b-4495-4a17-8925-7d00c52c7e19) to retrieve news-related data using valid
    query parameters.


    *   To build your request, retrieve a list of valid query parameters using [News Search Inputs](#90bfb6fb-2754-478b-b42d-f8c507ffffb2).

    *   For requests that require you to specify supported values (e.g., news categories), use the [Lookup](#efe7b4b8-1ef2-4fcd-a20f-9da68f6b2055)
    endpoints.

    *   Use [News Search Outputs](#354f6240-e3d3-4c8c-9684-86569fd71581) to retrieve a list of expected
    response fields that will be returned from [News Search](#4c4c979b-4495-4a17-8925-7d00c52c7e19).
