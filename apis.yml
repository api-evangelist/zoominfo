- aid: zoominfo:zoominfo-hashtags-enrich-api
  name: ZoomInfo Hashtags Enrich API
  description: >-
    Use [Hashtags Enrich](#886fb5cc-b587-4f26-bd68-892798d45ffe) to retrieve company hashtags using valid
    query parameters. A Hashtags Enrich request requires you to specify the input parameters about the
    company you are enriching.


    Refer to the examples provided to build a valid JSON request. Use the [Hashtags Enrich Inputs](#a7bea20a-f496-431b-9403-337231c4a22e)
    endpoint to retrieve a list of valid input parameters you can provide.
