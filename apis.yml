- aid: zoominfo:zoominfo-intent-enrich-api
  name: ZoomInfo Intent Enrich API
  description: >-
    Use [Intent Enrich](#c1e5300d-8ffb-40f0-b899-be98f884e505) to retrieve intent data using valid query
    parameters.


    Refer to the examples provided to build a valid JSON request:


    *   Use the [Intent Enrich Inputs](#2dcbe844-7f1f-45f3-ae32-2598ccec5be4) endpoint to retrieve a list
    of valid input parameters you can provide

    *   Use the [Intent Enrich Outputs](#fc4083cf-6179-4f0f-8b9b-80aedc2e3e67) endpoint to retrieve a
    list of valid output fields returned
