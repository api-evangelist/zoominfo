    *   Use the [Location Enrich Inputs](#5517cdb0-18c9-40ad-9d80-bdee7872d9e0) endpoint to retrieve a
    list of valid input parameters you can provide

    *   Use the [Location Enrich Outputs](#d1fbccf4-2224-4ba8-b72c-5b15e250c2f7) endpoint to retrieve
    a list of output fields returned
