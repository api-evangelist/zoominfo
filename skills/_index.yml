- name: score-accounts
  file: zoominfo-score-accounts.md
  description: Score and rank a list of accounts (mixed ZoomInfo company IDs, names, or domains) by ICP fit + buying
    intent + recent triggers. Returns per-account composite score (0–100), tier (A/B/C), explainable component breakdown
    (fit / intent / trigger / engagement), a specific "why now" sentence per account, and the working weight set
    as a saveable search filter set. Resolves name/domain inputs via search_companies with explicit confirmation
    for ambiguous matches. Iteratively refinable — adjust weights, swap axes, retier, or drill into a specific account.
    Use for account-based selling, ABM list prioritization, territory planning, sales prospecting prioritization,
    signal-based selling, buyer intent ranking, B2B prospecting. Triggers on phrases like "score these accounts",
    "prioritize this list", "rank by ICP fit and intent", "which accounts should I work first", "build a tiered
    account list".
- name: score-leads
  file: zoominfo-score-leads.md
  description: Score and prioritize leads or cold contacts (mixed ZoomInfo person IDs, emails, or name+company rows).
