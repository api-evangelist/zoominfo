skills:
- name: account-health
  file: zoominfo-account-health.md
  description: 'Assess the health of an account from its recent conversations — sentiment trajectory and risk signals
    — backed by an engagement timeline and an account_research snapshot. Identify the account by ZoomInfo company
    ID (preferred) or name/domain (triggers a lookup). Use when someone asks "how healthy is Acme", "are we at risk
    of churn here", "what''s the sentiment trend", or wants a risk read before a QBR or renewal. Strictly evidence-based:
    it does not invent risk or generic advice, and it asks the user for input where the conversations do not settle
    the question.'
- name: account-relationship-recap
  file: zoominfo-account-relationship-recap.md
  description: Recap where things stand with a company across recent conversations, with emphasis on how the relationship
    is evolving. Identify the account by ZoomInfo company ID (preferred) or by name or domain (triggers a lookup).
    Blends account_research for deal and firmographic context with company-scoped conversation_intelligence for
    what has actually been said recently. Use when someone asks "where are we with Acme", "how is the relationship
    trending", "recap our recent conversations with this account", or wants a relationship read before a check-in.
    Reasons over the last few engagements only.
- name: account-research
  file: zoominfo-account-research.md
  description: Produce a full intelligence brief on a target company — firmographics, CRM/account context, intent
    signals, recent news, scoops, and competitive landscape — framed by your GTM context and led with a TL;DR summary.
    Identify the account by ZoomInfo account/company ID (preferred) or by company name, domain, or ticker (which
    triggers a lookup step). Include detailed context on why the brief is being pulled.
- name: ae-cs-handoff
  file: zoominfo-ae-cs-handoff.md
  description: Produce an AE-to-CS handoff brief — everything the incoming CSM needs from the sales conversations.
    Builds an engagement timeline, then runs conversation_intelligence in parallel on the key engagements to pull
    requirements, success criteria, stakeholders and how they like to work, and the relationship state. Identify
    the account by ZoomInfo company ID (preferred) or name/domain (triggers a lookup). Use when someone says "build
    the handoff for Acme", "what does the CSM need to know", "prep the post-sale transition", or closes a deal that
    needs a clean handoff.
- name: build-list
  file: zoominfo-build-list.md
  description: Build a list of contacts or companies matching specific criteria. Describe what you're looking for
    in natural language and get a structured, tabular list you can export. Supports filtering by title, seniority,
    department, industry, company size, location, tech stack, growth rate, and more. Outputs a clean table artifact.
- name: buying-committee
  file: zoominfo-buying-committee.md
  description: Map the buying committee at a target account. Identifies decision-makers, prioritizes who to engage,
    and surfaces gaps and multi-thread risks. Leads with a TL;DR (top 3 to engage, biggest gap, multi-thread risk),
    uses compact tables, and deep-researches top stakeholders to catch stale records. Identify the account by ZoomInfo
    account/company ID (preferred) or by company name, domain, or ticker (which triggers a lookup step). Include
    detailed context on the deal, situation, and persona priorities driving the map.
- name: call-coaching
  file: zoominfo-call-coaching.md
  description: Coach a rep on how they handled a specific call — discovery quality, objection handling, talk dynamics,
    and next-call focus. Name the call if you know it, or let the skill pull recent calls and identify the most
    likely candidate to confirm. Uses conversation_intelligence to read how the conversation actually went. Use
    when someone asks "how did I do on the Acme call", "coach me on my last discovery call", "where did I lose them",
    or wants actionable feedback before the next conversation. Analyzes one call at a time.
- name: call-recap
  file: zoominfo-call-recap.md
  description: Recap a recent call with a tight summary, the decisions made, action items, and open questions. Name
    the call (account and/or date) if you know it, or let the skill pull your most recent calls and offer a shortlist
    to pick from. Uses conversation_intelligence to read what was actually said, with light account_research for
    deal context. Use when someone says "recap my last call", "what came out of the Acme meeting", "summarize yesterday's
    call", or needs a post-call writeup. The output adapts to the request — for example decisions-only or action-items-only.
- name: commitment-ledger
  file: zoominfo-commitment-ledger.md
  description: Build a ledger of what we promised versus what they promised, and what is still outstanding, across
    the last few engagements with an account or contact. Uses conversation_intelligence as the primary source. Identify
    the account or contact by ZoomInfo ID (preferred) or name (triggers a lookup), or point it at specific calls.
    Use when someone asks "what did we commit to", "what are they supposed to send us", "what's still outstanding
    with this account", or wants an accountability check before a follow-up. Covers the last few engagements only,
    not full history.
- name: company-intent-monitor
  file: zoominfo-company-intent-monitor.md
  description: Monitor a company's buyer-intent signals and assess fit against your GTM context. Uses company signals
    scoped to intent for a single account, returns the recent topics it is researching, and analyzes which ones
    align with your offerings and ICP. Identify the company by ZoomInfo company ID (preferred) or name/domain (triggers
    a lookup). Use when someone asks "what is Acme researching", "are they showing intent on anything we sell",
    "monitor intent for this account", or wants an intent read before prioritizing an account.
- name: company-news-monitor
  file: zoominfo-company-news-monitor.md
  description: Monitor recent news and business events for a company and deliver a quick digest. Uses company signals
    scoped to news and scoops for a single account, grouped by type and recency, with a "so what" for each. Identify
    the company by ZoomInfo company ID (preferred) or name/domain (triggers a lookup). Use when someone asks "what's
    the latest news on Acme", "any recent developments at this account", "catch me up on what's happening there",
    or wants a news digest before a touchpoint.
- name: competitor-analysis
  file: zoominfo-competitor-analysis.md
  description: Produce a fact-led competitive intel brief on one or more competitors — firmographics, recent strategic
    moves, product positioning, ICP overlap, and discovery questions. Defaults to your configured competitors from
    GTM context if none specified. Combines ZoomInfo data (account_research, scoops, intent, exec teams, similar
    companies) with web search for product/pricing/customer-sentiment intelligence. Identify competitors by ZoomInfo
    account/company ID (preferred) or name; include rich context on why the brief is being pulled and what decision
    it supports.
- name: contact-relationship-recap
  file: zoominfo-contact-relationship-recap.md
  description: Recap where things stand with a specific person across recent conversations, with emphasis on how
    the relationship is evolving. Identify the contact by ZoomInfo contact ID (preferred) or by name plus company
    (triggers a lookup). Blends contact-scoped conversation_intelligence for what this person has actually said
    recently with contact_research for their role and background. Use when someone asks "where are we with Jane",
    "is this person still our champion", "recap my conversations with this contact", or wants a read on an individual
    relationship before reaching out. Reasons over the last few engagements only.
- name: daily-brief
  file: zoominfo-daily-brief.md
  description: Brief the user on their day. Pull today's (or a named day's) meetings and, for each, synthesize the
    current state of play, a suggested focus or objective, and any follow-ups needed. Uses browse_engagements for
    the schedule, then account_research, contact_research, and conversation_intelligence per meeting. Use when someone
    says "what's on my plate today", "brief me for my meetings", "prep my day", or wants a morning rundown before
    back-to-back calls. Because it researches every meeting, it can consume meaningful AI credits — it confirms
    scope before fanning out across a full day.
- name: decision-process-mapper
  file: zoominfo-decision-process-mapper.md
  description: Map a prospect's buying process as voiced on recent calls — their stated decision criteria, timeline,
    steps, and approvers. Uses conversation_intelligence over an account's recent engagements, with account_research
    for stakeholder context. Identify the account by ZoomInfo company ID (preferred) or name/domain (triggers a
    lookup). Use when someone asks "what's their buying process", "who actually signs off", "what's the timeline
    and what do they need to decide", or wants to qualify a deal against MEDDIC-style criteria. Captures only what
    was actually stated; gaps are marked as unknown rather than inferred.
- name: draft-follow-up
  file: zoominfo-draft-follow-up.md
  description: Draft a follow-up email after a call by extracting the commitments and next steps that were actually
    agreed, then writing a compact, friendly-professional message. Name the call if you know it, or let the skill
    pull recent calls to pick from. Uses conversation_intelligence to read what was said and committed. Use when
    someone says "draft a follow-up to that call", "send a recap email", "write the follow-up for my Acme meeting",
    or needs a post-call note. Drafts only what the conversation supports — it does not invent commitments.
- name: email-thread-summarizer
  file: zoominfo-email-thread-summarizer.md
  description: Summarize a long email thread into its current state, the decisions and key points, and the open
    questions. Finds the thread with browse_engagements (emails), then uses conversation_intelligence with includeContent
    to read the actual thread body. Name the account, contact, or subject if you know it, or let the skill list
    recent threads to pick from. Use when someone says "summarize this email thread", "what's the state of the Acme
    thread", "catch me up on this email chain", or faces a long back-and-forth before replying. Summarizes one thread
    at a time.
- name: engagement-timeline
  file: zoominfo-engagement-timeline.md
  description: Build a timeline of engagements (meetings and emails) with an account or contact over a date range.
    Identify the account or contact by ZoomInfo ID (preferred), or by name or domain (triggers a lookup), or omit
    both to time-line your own recent engagements. Defaults to the last 90 days and can slide the window further
    back for a longer history. Returns a chronological timeline, a breakdown by engagement type, and a participant
    list with per-person engagement counts — and keeps each engagement's ID in context so you can immediately double-click
    any one to ask what was discussed. Use when someone asks "when did we last meet with X", "how often have we
    engaged this account", "show me the history with this contact", or wants a relationship timeline before a call.
- name: enrich-company
  file: zoominfo-enrich-company.md
  description: Look up a company's full profile. Provide a company name, domain, ticker symbol, or ZoomInfo company
